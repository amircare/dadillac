const img=new Image();img.onload=start;img.src=SRC;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=480,H=640;
function tint(col){const o=document.createElement('canvas');o.width=o.height=128;const x=o.getContext('2d');
 x.drawImage(img,0,0,128,128);x.globalCompositeOperation='source-atop';x.fillStyle=col;x.fillRect(0,0,128,128);
 const f=document.createElement('canvas');f.width=f.height=128;const y=f.getContext('2d');y.drawImage(img,0,0,128,128);y.drawImage(o,0,0);return f}
let red,gold,dim,keys={},px,lives,score,things,t,over,best=0,tx=null;
function start(){red=tint('rgba(255,0,0,.45)');gold=tint('rgba(255,200,0,.6)');
 dim=document.createElement('canvas');dim.width=dim.height=128;dim.getContext('2d').drawImage(img,0,0,128,128);
 reset();requestAnimationFrame(loop)}
function reset(){px=W/2;lives=3;score=0;things=[];t=0;over=false}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(over&&(e.key==' '||e.key=='Enter'))reset()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function pos(e){const r=cv.getBoundingClientRect();return (e.clientX-r.left)/r.width*W}
cv.addEventListener('pointerdown',e=>{if(over)reset();tx=pos(e)});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType=='touch')tx=pos(e)});
addEventListener('pointerup',()=>tx=null);
let last=0,acc=0,speed=1;
const dad=document.getElementById('dad');dad.onclick=()=>{speed=speed==1?2:1;dad.textContent='DAD MODE: '+(speed==2?'ON':'OFF');dad.classList.toggle('on',speed==2);dad.blur()};
function loop(now){now=now||0;if(!last)last=now;acc+=Math.min(now-last,100);last=now;const st=1000/(60*speed);while(acc>=st){update();acc-=st}draw();requestAnimationFrame(loop)}
function update(){t++;
 const sp=5;if(keys.arrowleft||keys.a)px-=sp;if(keys.arrowright||keys.d)px+=sp;
 if(tx!==null)px+=(tx-px)*.25;px=Math.max(30,Math.min(W-30,px));
 if(!over){
  if(t%Math.max(14,40-Math.floor(t/90))==0){const gd=Math.random()<.25,s=gd?30:30+Math.random()*40;
   things.push({x:s/2+Math.random()*(W-s),y:-s,s,gd,vy:(gd?2.5:2.5+Math.random()*2+t/1500),r:0,vr:(Math.random()-.5)*.2})}
  for(const o of things){o.y+=o.vy;o.r+=o.vr;
   if(Math.abs(o.x-px)<(o.s+50)/2.3&&Math.abs(o.y-(H-90))<(o.s+50)/2.3){o.dead=true;
    if(o.gd)score+=10;else if(--lives<=0){over=true;best=Math.max(best,score)}}
   if(o.y>H+80)o.dead=true}
  things=things.filter(o=>!o.dead)}
}
function draw(){
 const off=(t*.6)%64;ctx.globalAlpha=.25;
 for(let y=-64;y<H;y+=64)for(let x=0;x<W;x+=64)ctx.drawImage(dim,x,y+off,64,64);
 ctx.globalAlpha=1;
 for(let x=0;x<W;x+=40)ctx.drawImage(dim,x,H-40,40,40);
 for(const o of things){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.r);ctx.drawImage(o.gd?gold:red,-o.s/2,-o.s/2,o.s,o.s);ctx.restore()}
 ctx.save();ctx.translate(px,H-90);ctx.rotate(Math.sin(t/12)*.08);ctx.drawImage(dim,-25,-25,50,50);ctx.restore();
 ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=4;ctx.font='bold 22px system-ui';ctx.textAlign='left';
 ctx.strokeText('Score '+score,12,30);ctx.fillText('Score '+score,12,30);
 for(let i=0;i<lives;i++)ctx.drawImage(dim,W-36-i*34,10,28,28);
 if(over){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.drawImage(dim,W/2-70,H/2-170,140,140);
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 34px system-ui';ctx.fillText('Stared to death',W/2,H/2+10);
  ctx.font='20px system-ui';ctx.fillText('Score '+score+'  ·  Best '+best,W/2,H/2+48);ctx.fillText('Tap or press Space to retry',W/2,H/2+84)}}
</script></body></html>
